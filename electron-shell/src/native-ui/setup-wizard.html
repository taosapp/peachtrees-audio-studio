<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PeachTrees Media Studio - 启动中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ff6b6b;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 14px;
      color: #888;
      margin-bottom: 8px;
    }
    .progress-text {
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="logo">PeachTrees Media Studio</div>
  <div class="spinner"></div>
  <div class="status">正在启动后端服务...</div>
  <div class="progress-text">模型加载可能需要 1-3 分钟，请稍候</div>

  <script>
    const { ipcRenderer } = require('electron');
    const statusEl = document.querySelector('.status');

    // 监听后端启动进度（由 main.js 发送）
    ipcRenderer.on('backend-status', (event, message) => {
      statusEl.textContent = message;
    });
  </script>
</body>
</html>
